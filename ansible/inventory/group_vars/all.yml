---
# Committed defaults. Secret or user-specific values belong in generated
# inventory/group_vars/secrets.yml.

install_k3s: true
install_helm: true

# k3s/Kubernetes version selection. k3s_version takes precedence when set.
k3s_channel: "v1.34"
k3s_version: ""
k3s_config_dir: /etc/rancher/k3s
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml

# Envoy Gateway exposes app frontends through a real host socket published by setup.sh.
envoy_gateway_enabled: true
envoy_gateway_version: "1.4.6"
envoy_gateway_ns: aiq-gateway
envoy_web_nodeport: 30080
aiq_namespace: ns-aiq
aiq_frontend_service: aiq-frontend
aiq_frontend_service_port: 3000
aiq_route_path: /aiq
rag_namespace: rag
rag_frontend_service: rag-frontend
rag_frontend_service_port: 3000
rag_server_service: rag-server
rag_server_service_port: 8081
rag_ingestor_service: ingestor-server
rag_ingestor_service_port: 8082
rag_route_path: /rag
rag_api_route_path: /rag-api
rag_ingestor_route_path: /rag-ingest
