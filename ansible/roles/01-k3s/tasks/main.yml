---
- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"
  when: install_k3s | bool

- name: Write k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: "0644"
  notify: "{{ 'restart k3s' if k3s_role == 'server' else 'restart k3s-agent' }}"
  when: install_k3s | bool

- name: Install k3s server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | {{ ('INSTALL_K3S_VERSION=' ~ k3s_version) if (k3s_version | length > 0) else ('INSTALL_K3S_CHANNEL=' ~ k3s_channel) }} sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  when:
    - install_k3s | bool
    - k3s_role == 'server'

- name: Wait for the control-plane node to be Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=30s
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig }}"
  register: _node_ready
  changed_when: false
  retries: 20
  delay: 10
  until: _node_ready.rc == 0
  when:
    - install_k3s | bool
    - k3s_role == 'server'

- name: Read the cluster join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token
  when:
    - install_k3s | bool
    - k3s_role == 'server'

- name: Publish join token as a host fact
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_node_token.content | b64decode | trim }}"
  when:
    - install_k3s | bool
    - k3s_role == 'server'

- name: Install k3s agent
  vars:
    server_host: "{{ groups['server'][0] }}"
    server_ip: "{{ hostvars[server_host].ansible_default_ipv4.address }}"
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      {{ ('INSTALL_K3S_VERSION=' ~ k3s_version) if (k3s_version | length > 0) else ('INSTALL_K3S_CHANNEL=' ~ k3s_channel) }} \
      K3S_URL="https://{{ server_ip }}:6443" \
      K3S_TOKEN="{{ hostvars[server_host].k3s_token }}" sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/k3s
  when:
    - install_k3s | bool
    - k3s_role == 'agent'
