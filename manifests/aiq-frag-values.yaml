# AI-Q overrides used after the RAG Blueprint is deployed.
# Keep this separate from aiq-values.yaml so the tutorial can first install
# AI-Q without FRAG, then upgrade it to use RAG as a data source.

aiq:
  apps:
    backend:
      env:
        CONFIG_FILE: configs/config_web_frag.yml
        RAG_SERVER_URL: http://rag-server.rag.svc.cluster.local:8081/v1
        RAG_INGEST_URL: http://ingestor-server.rag.svc.cluster.local:8082/v1
