# Local AI-Q configuration used by Part IV of this tutorial.
# This file is based on AI-Q release/2.1 configs/config_web_frag.yml.
# It keeps the same FRAG sections and changes only a few values to demonstrate
# how configuration tuning works. The data_sources registry intentionally keeps
# only the Knowledge Base source so the UI no longer shows Web Search.

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: DEBUG
    # tracing:
    #   langsmith: # Optional: LangSmith tracing - requires langsmith API key.
    #     _type: langsmith
    #     project: nvidia-aiq

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  nemotron_llm_intent:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.5
    top_p: 0.9
    max_tokens: 4096
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

  nemotron_nano_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    temperature: 0.1
    top_p: 0.3
    max_tokens: 16384
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

  gpt_oss_llm:
    _type: nim
    model_name: openai/gpt-oss-120b
    base_url: https://integrate.api.nvidia.com/v1
    temperature: 1.0
    top_p: 1.0
    max_tokens: 256000
    api_key: ${NVIDIA_API_KEY}
    max_retries: 10

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: knowledge_layer
        name: "Knowledge Base"
        description: "Search uploaded documents and files."
        default_enabled: true
        tools:
          - knowledge_search

  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  knowledge_search:
    _type: knowledge_retrieval
    backend: foundational_rag
    collection_name: ${COLLECTION_NAME:-test_collection}
    top_k: 3
    rag_url: ${RAG_SERVER_URL:-http://localhost:8081}
    ingest_url: ${RAG_INGEST_URL:-http://localhost:8082}
    timeout: 300

  intent_classifier:
    _type: intent_classifier
    llm: nemotron_llm_intent
    # tools: omitted -> inherits all from data_source_registry
    # exclude_tools: []

  clarifier_agent:
    _type: clarifier_agent
    llm: nemotron_nano_llm
    planner_llm: nemotron_nano_llm
    # tools: omitted -> inherits all from data_source_registry
    # exclude_tools: []
    max_turns: 2
    enable_plan_approval: true
    log_response_max_chars: 2000
    verbose: true

  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_nano_llm
    # tools: omitted -> inherits all from data_source_registry
    exclude_tools:
      - advanced_web_search_tool
    max_llm_turns: 6
    max_tool_iterations: 4

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: gpt_oss_llm
    researcher_llm: nemotron_nano_llm
    planner_llm: gpt_oss_llm
    # tools: omitted -> inherits all from data_source_registry
    exclude_tools:
      - web_search_tool
    max_loops: 2

workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  enable_clarifier: true
  use_async_deep_research: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
