# Local AI-Q configuration used by Part IV of this tutorial.
# It follows the same structure described in the AI-Q configuration reference:
# general, llms, functions, and workflow.

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: DEBUG
  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: '.*'
      allow_methods: [GET, POST, DELETE, OPTIONS]
      allow_headers: ["*"]
      allow_credentials: true
      expose_headers: ["*"]

llms:
  nemotron_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    base_url: https://integrate.api.nvidia.com/v1
    temperature: 0.1
    top_p: 0.3
    max_tokens: 16384
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: true

  nemotron_llm_intent:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    base_url: https://integrate.api.nvidia.com/v1
    temperature: 0.5
    top_p: 0.9
    max_tokens: 4096
    num_retries: 5

  summary_llm:
    _type: nim
    model_name: nvidia/nemotron-mini-4b-instruct
    base_url: https://integrate.api.nvidia.com/v1
    temperature: 0.3
    max_tokens: 100
    num_retries: 5

functions:
  web_search_tool:
    _type: tavily_web_search
    max_results: 3
    max_content_length: 1000

  knowledge_search:
    _type: knowledge_retrieval
    backend: llamaindex
    collection_name: ${COLLECTION_NAME:-test_collection}
    top_k: 3
    chroma_dir: ${AIQ_CHROMA_DIR:-/tmp/chroma_data}
    generate_summary: true
    summary_model: summary_llm
    summary_db: ${AIQ_SUMMARY_DB:-sqlite+aiosqlite:///./summaries.db}

  intent_classifier:
    _type: intent_classifier
    llm: nemotron_llm_intent
    tools:
      - web_search_tool
      - knowledge_search
    verbose: true
    llm_timeout: 90

  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_llm
    tools:
      - web_search_tool
      - knowledge_search
    max_llm_turns: 6
    max_tool_iterations: 4
    verbose: true

  clarifier_agent:
    _type: clarifier_agent
    llm: nemotron_llm
    planner_llm: nemotron_llm
    tools:
      - web_search_tool
    max_turns: 2
    enable_plan_approval: true
    max_plan_iterations: 5
    verbose: true

  deep_research_agent:
    _type: deep_research_agent
    llm: nemotron_llm
    planner_llm: nemotron_llm
    researcher_llm: nemotron_llm
    tools:
      - web_search_tool
      - knowledge_search
    verbose: true

workflow:
  _type: chat_researcher
  description: "AI-Q lab custom configuration with DEBUG logging and tuned shallow research limits."
  intent_classifier: intent_classifier
  shallow_research_agent: shallow_research_agent
  clarifier_agent: clarifier_agent
  deep_research_agent: deep_research_agent
  enable_clarifier: true
  allow_shallow_to_deep_escalation: true
