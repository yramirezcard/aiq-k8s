# Mount a local AI-Q config file into the pods and make the backend CONFIG_FILE
# point to the mounted path.
#
# The ConfigMap itself is created from manifests/configs/config_lab_custom.yml
# in the tutorial commands. Use fusionConfig instead of app-level volumes or
# volumeMounts so the chart preserves existing mounts such as postgres-init.

aiq:
  fusionConfig:
    enabled: true
    volumeName: aiq-custom-config
    mountPath: /app/custom-config
    configMapName: aiq-custom-config

  apps:
    backend:
      env:
        CONFIG_FILE: /app/custom-config/config_lab_custom.yml
